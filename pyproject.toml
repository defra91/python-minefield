[project]
name = "python-minefield"
version = "0.1.0"
description = "Minefield game written in Python and with console interface."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[project.scripts]
python-minefield = "python_minefield:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.ruff]
# Lunghezza massima della riga
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Regole attive: E (Errori PyCodestyle), F (Pyflakes), I (isort/import ordinati)
select = ["E", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
